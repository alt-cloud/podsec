# Persistent RootlessKit port forwards for u7s.
#
# Runtime ports added with rootlessctl add-ports are not preserved after
# restarting rootlesskit. Add one port spec per line here to publish it on
# every u7s/rootlesskit start.
#
# Format is the same as rootlessctl add-ports:
# PARENTIP:PARENTPORT:CHILDPORT/PROTO
#
# Example:
# 0.0.0.0:30443:30443/tcp
